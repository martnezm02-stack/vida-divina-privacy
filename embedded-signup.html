<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectar WhatsApp — Vive Vida Divina</title>
<style>
  :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
      body {
          margin: 0;
              padding: 0;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                      line-height: 1.6;
                          color: #1f2328;
                              background-color: #ffffff;
                                }
                                  @media (prefers-color-scheme: dark) {
                                      body { color: #e6edf3; background-color: #0d1117; }
                                          .container { background-color: #161b22; border-color: #30363d; }
                                              .status { background-color: #21262d; border-color: #30363d; color: #e6edf3; }
                                                }
                                                  .container {
                                                      max-width: 560px;
                                                          margin: 0 auto;
                                                              padding: 48px 20px 64px;
                                                                  text-align: center;
                                                                    }
                                                                      h1 {
                                                                          font-size: 1.4rem;
                                                                              margin: 0 0 24px;
                                                                                }
                                                                                  p {
                                                                                      font-size: 1rem;
                                                                                        }
                                                                                          button#connect-whatsapp {
                                                                                              font-size: 1rem;
                                                                                                  font-weight: 600;
                                                                                                      padding: 12px 28px;
                                                                                                          margin-top: 24px;
                                                                                                              border: none;
                                                                                                                  border-radius: 8px;
                                                                                                                      background-color: #25D366;
                                                                                                                          color: #06301a;
                                                                                                                              cursor: pointer;
                                                                                                                                }
                                                                                                                                  button#connect-whatsapp:disabled {
                                                                                                                                      opacity: 0.6;
                                                                                                                                          cursor: not-allowed;
                                                                                                                                            }
                                                                                                                                              .status {
                                                                                                                                                  margin-top: 28px;
                                                                                                                                                      padding: 14px 18px;
                                                                                                                                                          border: 1px solid #d0d7de;
                                                                                                                                                              border-radius: 8px;
                                                                                                                                                                  background-color: #f6f8fa;
                                                                                                                                                                      font-size: 0.9rem;
                                                                                                                                                                          text-align: left;
                                                                                                                                                                              white-space: pre-wrap;
                                                                                                                                                                                }
                                                                                                                                                                                </style>
                                                                                                                                                                                </head>
                                                                                                                                                                                <body>
                                                                                                                                                                                <div id="fb-root"></div>
                                                                                                                                                                                
                                                                                                                                                                                <div class="container">
                                                                                                                                                                                  <h1>Conectar WhatsApp — Vive Vida Divina</h1>
                                                                                                                                                                                    <p>Conexión de WhatsApp para Vive Vida Divina</p>
                                                                                                                                                                                    
                                                                                                                                                                                      <button id="connect-whatsapp" type="button">Conectar WhatsApp</button>
                                                                                                                                                                                      
                                                                                                                                                                                        <div id="status" class="status">Estado: listo. Pulsa el botón para iniciar la conexión de la cuenta existente de WhatsApp Business.</div>
                                                                                                                                                                                        </div>
                                                                                                                                                                                        
                                                                                                                                                                                        <script>
                                                                                                                                                                                          var META_APP_ID = "1021640294034754";
                                                                                                                                                                                            var META_CONFIG_ID = "1411839117505777";
                                                                                                                                                                                              var GRAPH_API_VERSION = "v26.0";
                                                                                                                                                                                              
                                                                                                                                                                                                var statusEl = document.getElementById("status");
                                                                                                                                                                                                  var buttonEl = document.getElementById("connect-whatsapp");
                                                                                                                                                                                                  
                                                                                                                                                                                                    function isConfigured() {
                                                                                                                                                                                                        return META_APP_ID !== "APP_ID_PENDIENTE" && META_CONFIG_ID !== "CONFIG_ID_PENDIENTE";
                                                                                                                                                                                                          }
                                                                                                                                                                                                          
                                                                                                                                                                                                            window.fbAsyncInit = function () {
                                                                                                                                                                                                                if (!isConfigured()) {
                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                          }
                                                                                                                                                                                                                              FB.init({
                                                                                                                                                                                                                                    appId: META_APP_ID,
                                                                                                                                                                                                                                          autoLogAppEvents: true,
                                                                                                                                                                                                                                                xfbml: true,
                                                                                                                                                                                                                                                      version: GRAPH_API_VERSION
                                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                                            };
                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                              function fbLoginCallback(response) {
                                                                                                                                                                                                                                                                  if (response && response.authResponse) {
                                                                                                                                                                                                                                                                        statusEl.textContent = "Respuesta recibida de Meta. Revisa la consola del navegador para el detalle (no se guarda nada).";
                                                                                                                                                                                                                                                                              console.log("Embedded Signup response:", response);
                                                                                                                                                                                                                                                                                  } else {
                                                                                                                                                                                                                                                                                        statusEl.textContent = "El proceso se canceló o no se completó.";
                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                function launchWhatsAppSignup() {
                                                                                                                                                                                                                                                                                                    if (!isConfigured()) {
                                                                                                                                                                                                                                                                                                          statusEl.textContent =
                                                                                                                                                                                                                                                                                                                  "Esta página todavía no tiene Configuration ID de Meta.\n" +
                                                                                                                                                                                                                                                                                                                          "No se puede iniciar Embedded Signup hasta que se reemplacen los placeholders APP_ID_PENDIENTE y CONFIG_ID_PENDIENTE con los valores reales generados en Meta for Developers.";
                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                        FB.login(fbLoginCallback, {
                                                                                                                                                                                                                                                                                                                                              config_id: META_CONFIG_ID,
                                                                                                                                                                                                                                                                                                                                                    response_type: "code",
                                                                                                                                                                                                                                                                                                                                                          override_default_response_type: true,
                                                                                                                                                                                                                                                                                                                                                                extras: {
                                                                                                                                                                                                                                                                                                                                                                        setup: {},
                                                                                                                                                                                                                                                                                                                                                                                featureType: "whatsapp_business_app_onboarding",
                                                                                                                                                                                                                                                                                                                                                                                        sessionInfoVersion: "3"
                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                      window.addEventListener("message", function (event) {
                                                                                                                                                                                                                                                                                                                                                                                                          if (!event.origin.endsWith("facebook.com")) {
                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                                                                                              var data = JSON.parse(event.data);
                                                                                                                                                                                                                                                                                                                                                                                                                                    if (data.type === "WA_EMBEDDED_SIGNUP") {
                                                                                                                                                                                                                                                                                                                                                                                                                                            console.log("Embedded Signup session event:", data);
                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (data.event === "FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                              statusEl.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Meta confirmó el evento FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING.\n" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "Revisa la consola del navegador para el detalle completo (WABA ID, phone number ID).";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              } else if (data.event === "CANCEL") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        statusEl.textContent = "El proceso se canceló en el paso: " + (data.data && data.data.current_step);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          statusEl.textContent = "Evento de sesión recibido: " + data.event;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } catch (e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // Ignorar mensajes que no sean JSON del flujo de Embedded Signup.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          buttonEl.addEventListener("click", launchWhatsAppSignup);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (isConfigured()) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                (function (d, s, id) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      var js, fjs = d.getElementsByTagName(s)[0];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (d.getElementById(id)) { return; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  js = d.createElement(s); js.id = id;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        js.src = "https://connect.facebook.net/es_LA/sdk.js";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              fjs.parentNode.insertBefore(js, fjs);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }(document, "script", "facebook-jssdk"));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        buttonEl.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </html>
